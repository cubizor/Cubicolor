name: CI/CD Pipeline

on:
  push:
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write
  packages: write
  checks: write

jobs:
  build-and-release:
    name: Test & Publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 'lts/*'

      - name: Run Tests
        run: ./gradlew clean build test --no-daemon --stacktrace

      - name: Publish Test Results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: (!cancelled())
        with:
          files: '**/build/test-results/**/*.xml'
          check_name: 'Test Results'

      - name: Semantic Release
        uses: cycjimmy/semantic-release-action@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          extra_plugins: |
            @semantic-release/changelog
            @semantic-release/git
            gradle-semantic-release-plugin

      # GitHub Packages demands a token even for public packages, so anything resolving Cubicolor at
      # runtime (Paper's MavenLibraryResolver on a game server) cannot read it. `publish` also emits a
      # plain Maven layout into build/maven-repo; mirror it onto the `maven-repo` branch, which
      # raw.githubusercontent.com then serves anonymously. Additive — old versions are never dropped.
      - name: Mirror to public Maven repo
        if: success()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ ! -d build/maven-repo ]; then
            echo "No release published this run — nothing to mirror."
            exit 0
          fi
          remote="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          work="$(mktemp -d)"
          if git clone --branch maven-repo --single-branch --depth 1 "$remote" "$work" 2>/dev/null; then
            echo "Existing maven-repo branch checked out."
          else
            git clone --depth 1 "$remote" "$work"
            git -C "$work" checkout --orphan maven-repo
            git -C "$work" rm -rqf .
          fi
          cp -R build/maven-repo/. "$work"/
          git -C "$work" config user.name "github-actions[bot]"
          git -C "$work" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$work" add -A
          if git -C "$work" diff --cached --quiet; then
            echo "Public mirror already up to date."
          else
            git -C "$work" commit -m "chore(maven-repo): publish $(grep -E '^version' gradle.properties | cut -d= -f2 | tr -d ' ')"
            git -C "$work" push origin maven-repo
          fi
